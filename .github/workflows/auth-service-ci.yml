name: auth-service-ci
on:
  push:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
