name: auth-service-ci
on:
  push:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
