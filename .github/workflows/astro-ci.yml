name: astro-ci
on:
  push:
    paths:
      - "frontends/marketing-astro/**"
      - ".github/workflows/astro-ci.yml"
  pull_request:
    paths:
      - "frontends/marketing-astro/**"
      - ".github/workflows/astro-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/marketing-astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
