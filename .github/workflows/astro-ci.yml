name: astro-ci
on:
  push:
    paths:
      - "frontends/marketing-astro/**"
      - ".github/workflows/astro-ci.yml"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/marketing-astro
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
