name: svelte-ci
on:
  push:
    paths:
      - "frontends/admin-svelte/**"
      - ".github/workflows/svelte-ci.yml"
  pull_request:
    paths:
      - "frontends/admin-svelte/**"
      - ".github/workflows/svelte-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/admin-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
