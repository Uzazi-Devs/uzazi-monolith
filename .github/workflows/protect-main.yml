name: protect-main
on:
  push:
    branches: [main]

jobs:
  verify-pr-merge:
    name: Verify push came from a merged PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check that HEAD belongs to a merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = prs.find(pr => pr.merged_at && pr.base.ref === 'main');
            if (!merged) {
              core.setFailed(
                `Commit ${context.sha} was pushed directly to main without a merged pull request. ` +
                'Direct pushes to main are not allowed: revert it and merge through a PR.'
              );
              return;
            }
            core.info(`OK: merged via PR #${merged.number} (${merged.title}).`);
