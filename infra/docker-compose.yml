name: uzazi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uzazi}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]

  # Runs db/migrations against postgres ONCE, before backend/auth-service.
  # This is the only migration runner — no ORM auto-migrates on its own.
  migrate:
    image: migrate/migrate:latest
    volumes: ["../db/migrations:/migrations:ro"]
    command:
      [
        "-path=/migrations",
        "-database=${DATABASE_URL}",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["${AUTH_PORT:-3000}:3000"]

  backend:
    build: ../backend
    environment:
      PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      AI_PROVIDER: ${AI_PROVIDER}
      REDIS_URL: ${REDIS_URL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["${BACKEND_PORT:-8080}:8080"]

  # Frontends can build optimized production images or mount source for local dev
  marketing-astro:
    build:
      context: ..
      dockerfile: frontends/marketing-astro/Dockerfile
    working_dir: /app
    volumes: ["../frontends/marketing-astro:/app"]
    command: sh -c "bun install && bun run dev"
    environment:
      PUBLIC_AUTH_URL: ${PUBLIC_AUTH_URL}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
      PUBLIC_WAITLIST_FORM_ENDPOINT: ${PUBLIC_WAITLIST_FORM_ENDPOINT}
    ports: ["${MARKETING_PORT:-4321}:4321"]

  app-nextjs:
    build:
      context: ..
      dockerfile: frontends/app-nextjs/Dockerfile
    working_dir: /app
    volumes: ["../frontends/app-nextjs:/app"]
    command: sh -c "bun install && bun run dev"
    environment:
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    ports: ["${APP_PORT:-3001}:3001"]


  caddy:
    image: caddy:2-alpine
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["80:80"]
    depends_on:
      - backend
      - auth-service
      - marketing-astro
      - app-nextjs

volumes:
  pgdata:

